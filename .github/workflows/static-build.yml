name: Static site build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build static site and compile Tailwind
        run: npm run build:static
      - name: Verify static output
        run: |
          test -s dist/assets/css/tailwind.css
          test -s dist/index.html
          html_count=$(find dist -maxdepth 2 -type f -name '*.html' | wc -l)
          echo "Public HTML pages generated: $html_count"
          test "$html_count" -eq 15
          test -s dist/assets/css/decho-wave-background.css
          test -s dist/assets/js/decho-wave-background.js
          test -s dist/assets/css/decho-home-hero.css
          test -s dist/assets/js/decho-home-hero.js
          test -s dist/assets/images/decho-hero-collage.jpg
          grep -q 'class="dh-hero"' dist/index.html
          test -s dist/assets/css/layanan-konstruksi.css
          test -s dist/assets/js/layanan-konstruksi.js
          grep -q 'id="layanan-konstruksi"' dist/layanan.html
          test -s dist/assets/css/decho-sync.css
          test -s dist/assets/css/proyek-arsip.css
          test -s dist/assets/js/proyek-arsip.js
          grep -q 'id="arCabinet"' dist/proyek.html
          test -s dist/assets/images/ilustrasi-sarana-pelabuhan.svg
          test -s dist/assets/images/ilustrasi-konstruksi-gudang.svg
          test -s dist/assets/images/ilustrasi-rumah-hunian.svg
          grep -q 'data-proc="2"' dist/proyek.html
          ! grep -q 'class="topbar"' dist/index.html
