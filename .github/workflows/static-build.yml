name: Static site build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build static site and compile Tailwind
        run: npm run build:static
      - name: Verify static output
        run: |
          test -s dist/assets/css/tailwind.css
          test -s dist/index.html
          html_count=$(find dist -maxdepth 2 -type f -name '*.html' | wc -l)
          echo "Public HTML pages generated: $html_count"
          test "$html_count" -eq 15
          test -s dist/assets/css/decho-wave-background.css
          test -s dist/assets/js/decho-wave-background.js
          test -s dist/assets/css/decho-logo-animation.css
          test -s dist/assets/js/decho-logo-animation.js
          grep -q 'id="decho-logo-stage"' dist/index.html
          ! grep -q '<iframe class="decho-logo-frame"' dist/index.html
          ! grep -q '<g class="grid">' dist/index.html
